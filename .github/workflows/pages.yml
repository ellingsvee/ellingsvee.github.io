name: Build and deploy site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.8"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: blog/uv.lock

      - name: Install Python dependencies
        run: uv sync --project blog --locked

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render blog
        run: uv run --project blog --locked quarto render blog

      - name: Assemble deployment artifact
        run: |
          mkdir -p _site/blog
          cp index.html style.css _site/
          cp -a Files _site/Files
          cp -a blog/_site/. _site/blog/

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
